name: Foundation CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    name: macOS foundation (no account signing)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MARKETDECISION_TEST_KEYCHAIN: '0'
    steps:
      - name: Checkout public source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Tests, traceability and module boundaries
        id: tests
        run: bash MarketDecision/Scripts/verify-ci.sh tests
      - name: Debug and Release build checks
        id: builds
        run: bash MarketDecision/Scripts/verify-ci.sh builds
      - name: Native interaction tests on macOS 15
        id: native_ui
        env:
          REQUIRE_UI_OS_MAJOR: '15'
        run: bash MarketDecision/Scripts/verify-native-ui.sh
      - name: Record evidence limits
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.builds.outcome }}
          NATIVE_UI_OUTCOME: ${{ steps.native_ui.outcome }}
        run: |
          {
            echo '## Foundation CI evidence'
            echo "- Tests/UTC/traceability/module checks: $TEST_OUTCOME"
            echo "- Debug/Release build and artifact checks: $BUILD_OUTCOME"
            echo "- Native interaction suite (four cases, isolated synthetic host): $NATIVE_UI_OUTCOME"
            echo '- Keychain integration: NOT EXECUTED (opt-in test skipped, not passed).'
            echo '- Builds use ad-hoc signatures only; no account certificate or provisioning profile.'
            echo '- Native UI uses shared production views in a separate in-memory test app; no signed Keychain, VoiceOver speech or real IME composition evidence.'
            echo '- No notarization, performance or full private acceptance evidence. No artifact uploads.'
            echo '- CI success does not close Phase 0 or DATA-001.'
          } >> "$GITHUB_STEP_SUMMARY"
