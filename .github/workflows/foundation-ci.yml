name: Foundation CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    name: macOS foundation (no account signing)
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MARKETDECISION_TEST_KEYCHAIN: '0'
    steps:
      - name: Checkout public source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Tests and module boundaries
        id: tests
        run: bash MarketDecision/Scripts/verify-ci.sh tests
      - name: Debug and Release build checks
        id: builds
        run: bash MarketDecision/Scripts/verify-ci.sh builds
      - name: Record evidence limits
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.builds.outcome }}
        run: |
          {
            echo '## Foundation CI evidence'
            echo "- Tests/UTC/module checks: $TEST_OUTCOME"
            echo "- Debug/Release build and artifact checks: $BUILD_OUTCOME"
            echo '- Keychain integration: NOT EXECUTED (opt-in test skipped, not passed).'
            echo '- Builds use ad-hoc signatures only; no account certificate or provisioning profile.'
            echo '- No app UI launch, notarization, performance, full private acceptance or signed Keychain evidence.'
            echo '- CI success does not close Phase 0 or DATA-001.'
          } >> "$GITHUB_STEP_SUMMARY"
